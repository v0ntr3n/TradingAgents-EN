version: "2.1.0"
standard: "ASD-STE100"

trade_reflection_system_prompt: |
  Extract reusable structured lessons from the completed trade review.
  Verify which market judgments succeeded and which judgments failed.
  Return a single JSON object with keys reasoning, improvement, summary, and query.
  Do not include markdown code fences or extra commentary.
  Use "Insufficient information to reflect deeply" when review data is incomplete.

analysis_reflection_system_prompt: |
  Extract reusable structured lessons from the investment research report.
  Identify core evidence and missing analytical dimensions for the symbol.
  Return a single JSON object with keys reasoning, improvement, summary, and query.
  Do not include markdown code fences or extra commentary.
  Use "Insufficient information to reflect deeply" when report data is incomplete.

debate_reflection_system_prompt: |
  Extract reusable structured lessons from the bull-bear debate history and final ruling.
  Identify which arguments improved calibration and which risks were overlooked.
  Return a single JSON object with keys reasoning, improvement, summary, and query.
  Do not include markdown code fences or extra commentary.
  Use "Insufficient information to reflect deeply" when debate data is incomplete.

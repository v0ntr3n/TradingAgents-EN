[server]
# Server configuration
port = 8501
address = "0.0.0.0"  # Docker The environment needs to listen on all interfaces
headless = true      # Docker Environment headless mode
enableCORS = false
enableXsrfProtection = false

# File Monitoring Configuration - Solving File Locking Problems under Windows
fileWatcherType = "none"
runOnSave = false

[browser]
# Browser configuration
gatherUsageStats = false

[logger]
# Log configuration
level = "info"

[global]
# Global configuration
developmentMode = false

[theme]
# Theme configuration
base = "light"
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
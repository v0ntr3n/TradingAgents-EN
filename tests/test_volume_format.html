<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test volume formatting</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-case {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success {
            background-color: #f0f9ff;
            border-color: #0ea5e9;
        }
        .error {
            background-color: #fef2f2;
            border-color: #ef4444;
        }
        h1 {
            color: #333;
        }
        h2 {
            color: #666;
            font-size: 18px;
        }
        .label {
            font-weight: bold;
            color: #555;
        }
        .value {
            color: #0ea5e9;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>🧪 Test volume formatting</h1>
    
    <div id="results"></div>

    <script>
        // Original formatting function (wrong)
        function fmtVolumeOld(v) {
            const n = Number(v);
            if (!Number.isFinite(n)) return '-';
            if (n >= 1e8) return (n/1e8).toFixed(2) + 'billion hands';
            if (n >= 1e4) return (n/1e4).toFixed(2) + 'Thousands of hands';
            return n.toFixed(0);
        }

        // New formatting functions (correct)
        function fmtVolumeNew(v) {
            const n = Number(v);
            if (!Number.isFinite(n)) return '-';
            
            // 🔥 The database stores"shares", Need to be divided by 100 to convert to"hand"
            const lots = n / 100;
            
            if (lots >= 1e8) return (lots/1e8).toFixed(2) + 'billion hands';
            if (lots >= 1e4) return (lots/1e4).toFixed(2) + 'Thousands of hands';
            return lots.toFixed(0) + 'hand';
        }

        // test case
        const testCases = [
            {
                name: 'CATL (300750)',
                volume: 23939074,  // Value(share) in database
                expected: '23.94 Thousands of hands',  // Oriental wealth display
            },
            {
                name: 'small trading volume',
                volume: 100000,  // 10 10,000 shares
                expected: '1000 hand',
            },
            {
                name: 'medium volume',
                volume: 50000000,  // 5000 10,000 shares
                expected: '50.00 Thousands of hands',
            },
            {
                name: 'Large trading volume',
                volume: 10000000000,  // 100 100 million shares
                expected: '1.00 billion hands',
            },
        ];

        // Run tests
        const resultsDiv = document.getElementById('results');
        
        testCases.forEach(testCase => {
            const oldResult = fmtVolumeOld(testCase.volume);
            const newResult = fmtVolumeNew(testCase.volume);
            const isCorrect = newResult === testCase.expected;
            
            const div = document.createElement('div');
            div.className = `test-case ${isCorrect ? 'success' : 'error'}`;
            div.innerHTML = `
                <h2>${testCase.name}</h2>
                <p><span class="label">Original value (shares):</span>${testCase.volume.toLocaleString()}</p>
                <p><span class="label">Expected result:</span><span class="value">${testCase.expected}</span></p>
                <p><span class="label">Old function result:</span><span style="color: #ef4444;">${oldResult}</span> ❌</p>
                <p><span class="label">New function result:</span><span class="value">${newResult}</span> ${isCorrect ? '✅' : '❌'}</p>
            `;
            resultsDiv.appendChild(div);
        });
    </script>
</body>
</html>

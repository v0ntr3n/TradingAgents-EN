<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cookie Authentication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Test Hybrid Certification (Session Cookie + JWT Token) </h1>

    <div class="test-section">
        <h2>1. Login test</h2>
        <button onclick="testLogin()">Login (get Cookie and Token)</button>
        <div id="login-result"></div>
    </div>

    <div class="test-section">
        <h2>2. Cookie Certification testing</h2>
        <button onclick="testCookieAuth()">Use Cookie Authentication (without Authorization)</button>
        <div id="cookie-result"></div>
    </div>

    <div class="test-section">
        <h2>3. JWT Token Certification testing</h2>
        <button onclick="testJWTAuth()">Authentication using JWT Token</button>
        <div id="jwt-result"></div>
    </div>

    <div class="test-section">
        <h2>4. Log out test</h2>
        <button onclick="testLogout()">Log out (clear cookies and session)</button>
        <div id="logout-result"></div>
    </div>

    <div class="test-section">
        <h2>5. View Cookies</h2>
        <button onclick="showCookies()">View current Cookies</button>
        <div id="cookies-result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let accessToken = null;

        // Login test
        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            resultDiv.innerHTML = '<p class="info">logging in...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',  // IMPORTANT: Allow sending and receiving Cookie
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    accessToken = data.data.access_token;
                    resultDiv.innerHTML = `
                        <p class="success">✅ Login successful!</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <p class="info">JWT Token: ${accessToken.substring(0, 50)}...</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Login failed:${data.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error:${error.message}</p>`;
            }
        }

        // Cookie Certification testing
        async function testCookieAuth() {
            const resultDiv = document.getElementById('cookie-result');
            resultDiv.innerHTML = '<p class="info">Testing cookie authentication...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/auth/me`, {
                    method: 'GET',
                    credentials: 'include'  // IMPORTANT: SEND Cookie
                    // Note: Do not set Authorization header
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <p class="success">✅ Cookie Certification successful!</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Cookie Authentication failed:${data.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error:${error.message}</p>`;
            }
        }

        // JWT Token Certification testing
        async function testJWTAuth() {
            const resultDiv = document.getElementById('jwt-result');

            if (!accessToken) {
                resultDiv.innerHTML = '<p class="error">❌ Please log in first to obtain Token</p>';
                return;
            }

            resultDiv.innerHTML = '<p class="info">Testing JWT Token authentication...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/auth/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    },
                    credentials: 'include'
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <p class="success">✅ JWT Token Certification successful!</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ JWT Token Authentication failed:${data.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error:${error.message}</p>`;
            }
        }

        // Log out test
        async function testLogout() {
            const resultDiv = document.getElementById('logout-result');
            resultDiv.innerHTML = '<p class="info">Logging out...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });

                const data = await response.json();

                if (data.success) {
                    accessToken = null;
                    resultDiv.innerHTML = `
                        <p class="success">✅ Log out successfully!</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Logout failed:${data.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error:${error.message}</p>`;
            }
        }

        // View Cookies
        function showCookies() {
            const resultDiv = document.getElementById('cookies-result');
            const cookies = document.cookie;

            if (cookies) {
                resultDiv.innerHTML = `
                    <p class="success">Current Cookies:</p>
                    <pre>${cookies}</pre>
                `;
            } else {
                resultDiv.innerHTML = '<p class="info">No Cookies</p>';
            }
        }
    </script>
</body>
</html>

[pytest]
# Only collect tests/ directory, avoid root directory test_*.py Scanned by mistake
testpaths = tests

# Tests tagged with integration are skipped by default (can be run with -m integration)
addopts = -m "not integration" -k "not (test_server_config or test_stock_codes)"

# Tag definitions to avoid warnings
markers =
    integration: Mark integration/end-to-end testing (skipped by default)
    smoke: Mark tests suitable for quick regression in CI


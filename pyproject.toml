[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents-cn-pro"
version = "3.0.0"
description = "TradingAgents-CN Pro - Multi-agent stock analysis system with advanced features"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Backend API framework and server
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",

    # Database and cache
    "motor>=3.3.0",
    "pymongo>=4.0.0",
    "redis>=6.2.0",

    # Authentication and security
    "PyJWT>=2.0.0",
    "bcrypt>=4.0.0",
    "itsdangerous>=2.0.0",  # Session Signature (required by SessionMiddleware)

    # Task scheduling and asynchronous
    "apscheduler>=3.10.0",
    "aiofiles>=0.8.0",

    # HTTP client and SSE
    "httpx>=0.24.0",
    "sse-starlette>=1.0.0",
    "mcp>=1.12.0",
    "mem0ai>=1.0.7",
    "jinja2>=3.0.0",  # Template engine (required for email templates)

    # Log processing
    "concurrent-log-handler>=0.9.24",  # Windows Friendly log rotation handler

    # Data sources and financial data
    "akshare>=1.17.86",
    "baostock>=0.8.8",
    "eodhd>=1.0.32",
    "finnhub-python>=2.4.23",
    "tushare>=1.4.21",
    "yfinance>=0.2.63",
    "stockstats>=0.6.5",

    # AI and LLM
    "chromadb>=1.0.12",
    "dashscope>=1.20.0",
    "google-generativeai>=0.8.3",  # Google Gemini SDK
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=2.1.12",  # Fix client_options undefined error
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "openai>=1.0.0,<2.0.0",
    "qdrant-client>=1.7.0",  # Vector database client

    # Data processing and analysis
    "pandas>=2.3.0",
    "xlrd>=2.0.2",
    "openpyxl>=3.1.0",  # Valuation Calculation Excel Deliverables (A10-D1)

    # Web crawling and parsing
    "curl-cffi>=0.6.0",  # Simulate real browser TLS fingerprints and bypass anti-crawler detection
    "feedparser>=6.0.11",
    "parsel>=1.10.0",
    "praw>=7.8.1",
    "requests>=2.32.4",

    # Documentation and formatting
    "markdown>=3.4.0",
    "pypandoc>=1.11",
    "python-docx>=0.8.11",  # Word Document processing for fixing text orientation
    "pdfkit>=1.0.0",  # PDF Generation tool, requires wkhtmltopdf (external tool)
    "weasyprint>=62.0",  # PDF Build tools (pure Python, recommended, no external tools required)

    # Tools and Aids
    "psutil>=6.1.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "rich>=14.0.0",
    "setuptools>=80.9.0",
    "toml>=0.10.2",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
]

[project.optional-dependencies]
qianfan = ["qianfan>=0.4.20"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
tradingagents = "main:main"

[tool.setuptools.packages.find]
include = ["tradingagents*"]
exclude = ["tests*", "docs*", "scripts*", "data*", "logs*", "reports*", "results*", "eval_results*", "upstream_contribution*"]

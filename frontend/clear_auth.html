<!DOCTYPE html>
<html>
<head>
    <title>Clear authentication information</title>
    <meta charset="utf-8">
</head>
<body>
    <h1>Clear authentication information</h1>
    <p>Click the button below to clear all authentication information:</p>
    <button onclick="clearAuth()">Clear authentication information</button>
    <div id="result"></div>

    <script>
        function clearAuth() {
            try {
                // Clear all authentication-related localStorage items
                localStorage.removeItem('auth-token');
                localStorage.removeItem('refresh-token');
                localStorage.removeItem('user-info');
                
                // Clear all possible certification dependencies
                const keys = Object.keys(localStorage);
                keys.forEach(key => {
                    if (key.includes('auth') || key.includes('token') || key.includes('user')) {
                        localStorage.removeItem(key);
                    }
                });
                
                document.getElementById('result').innerHTML = '<p style="color: green;">✅ Certification information has been cleared! Please refresh the page and log in again.</p>';
                
                // 3 Automatically jump to the login page after seconds
                setTimeout(() => {
                    window.location.href = '/login';
                }, 3000);
                
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color: red;">❌ Clear failed: ' + error.message + '</p>';
            }
        }
        
        // Display current authentication information when the page loads
        window.onload = function() {
            const authToken = localStorage.getItem('auth-token');
            const refreshToken = localStorage.getItem('refresh-token');
            const userInfo = localStorage.getItem('user-info');
            
            let info = '<h2>Current certification information:</h2>';
            info += '<p>Auth Token: ' + (authToken ? 'exist (' + authToken.length + ' character)' : 'does not exist') + '</p>';
            info += '<p>Refresh Token: ' + (refreshToken ? 'exist (' + refreshToken.length + ' character)' : 'does not exist') + '</p>';
            info += '<p>User Info: ' + (userInfo ? 'exist' : 'does not exist') + '</p>';
            
            document.getElementById('result').innerHTML = info;
        };
    </script>
</body>
</html>

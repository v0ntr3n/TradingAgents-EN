<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon configuration - multiple formats for browser compatibility -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2.0" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2.0" />
    <link rel="icon" href="/favicon.ico?v=2.0" sizes="16x16 32x32 48x48" />
    <title>%VITE_APP_TITLE% - Multi-Agent Stock Analysis & Learning Platform</title>
    <meta name="description" content="Modern multi-agent stock analysis and learning platform supporting A-share, US, and Hong Kong stock analysis" />
    <meta name="keywords" content="stock analysis,AI analysis,multi-agent,TradingAgents" />
    <meta name="author" content="TradingAgents-CN Team" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tradingagents.cn/" />
    <meta property="og:title" content="TradingAgents-CN - Multi-Agent Stock Analysis & Learning Platform" />
    <meta property="og:description" content="Modern multi-agent stock analysis and learning platform supporting A-share, US, and Hong Kong stock analysis" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tradingagents.cn/" />
    <meta property="twitter:title" content="TradingAgents-CN - Multi-Agent Stock Analysis & Learning Platform" />
    <meta property="twitter:description" content="Modern multi-agent stock analysis and learning platform supporting A-share, US, and Hong Kong stock analysis" />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Theme color -->
    <meta name="theme-color" content="#409EFF" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TradingAgents-CN" />
    <link rel="apple-touch-icon" href="/favicon.ico?v=2.0" />

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

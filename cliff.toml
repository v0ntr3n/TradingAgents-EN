# git-cliff Configuration file
# Usage: git-cliff --tag-pattern "v2.*" Generate v2.x changelog

[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ date | format_date }})\
{% else %}\
## [Unreleased]\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "new features" },
    { message = "^fix", group = "Bug Repair" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance optimization" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "coding style" },
    { message = "^test", group = "test" },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
]
tag_pattern = "v[0-9]+.*"

[git.date]
format = "%Y-%m-%d"

# SearXNG Configuration file - TradingAgents-CN only
# Based on use_default_settings, only cover the parts that need to be customized
# Deployment location:runtime/searxng-settings.yml
# Specify this file path through the SEARXNG_SETTINGS_PATH environment variable at startup

use_default_settings: true

general:
  debug: false
  instance_name: "TradingAgents-CN Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120

server:
  port: 8888
  bind_address: "127.0.0.1"
  base_url: false
  # Disable limiter (no Redis/Valkey required)
  limiter: false
  public_instance: false
  secret_key: "ta_searxng_local_secret_key_2026"
  image_proxy: false
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

# Do not connect to Valkey/Redis (limiter disabled)
valkey:
  url: false

outgoing:
  # Single engine request timeout is 2 seconds, total timeout is 5 seconds
  request_timeout: 2.0
  max_request_timeout: 5.0
  useragent_suffix: ""
  pool_connections: 100

# Only enable domestically accessible search engines
engines:
  - name: baidu
    engine: baidu
    baidu_category: general
    categories: [general]
    shortcut: bd
    disabled: false

  - name: 360search
    engine: 360search
    shortcut: 360so
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
    base_url: https://cn.bing.com

  - name: sogou
    engine: sogou
    shortcut: sogou
    disabled: false

# config/data_schema.yaml
# Data dictionary extended field configuration
# 
# Define extended data fields that do not rely on Agent registration
# NOTE: Core fields (context.ticker, context.trade_date etc.) are hardcoded in the code and cannot be overridden here

layers:
  # Original data layer extension fields
  raw_data:
    description: "Raw data layer - from data collector"
    fields:
      # price data
      price_data:
        type: object
        source: data_collector
        description: "OHLCV price data"
      
      # news data
      news_data:
        type: array
        source: data_collector
        description: "News list data"
      
      # financial data
      financial_data:
        type: object
        source: data_collector
        description: "financial statement data"
      
      # social media data
      social_data:
        type: object
        source: data_collector
        description: "Social media public opinion data"
      
      # Sector data
      sector_data:
        type: object
        source: data_collector
        description: "Section information"
      
      # index data
      index_data:
        type: object
        source: data_collector
        description: "Related index data"
      
      # Fund flow data
      fund_flow_data:
        type: object
        source: data_collector
        description: "Main capital flow data"
      
      # Dragon and Tiger List Data
      dragon_tiger_data:
        type: object
        source: data_collector
        description: "Dragon and Tiger List Transaction Data"
      
      # Margin and securities lending data
      margin_data:
        type: object
        source: data_collector
        description: "Margin and securities lending data"

  # Analyze data layer extension fields
  analysis_data:
    description: "Analytical data layer - structured analysis results"
    fields:
      # Technical indicators
      technical:
        type: object
        description: "Technical Analysis Indicators (MA, RSI, MACD etc.)"
      
      # sentiment indicator
      sentiment:
        type: object
        description: "Sentiment Analysis Indicators"
      
      # Valuation indicators
      valuation:
        type: object
        description: "Valuation analysis indicators (PE, PB, ROE etc.)"
      
      # market breadth
      market_breadth:
        type: object
        description: "market breadth indicator"
      
      # Sector ranking
      sector_ranking:
        type: object
        description: "Section ranking data"
      
      # money flow indicator
      fund_flow_metrics:
        type: object
        description: "Fund flow analysis indicators"
      
      # Chip distribution
      chip_distribution:
        type: object
        description: "Chip distribution analysis"

  # Reporting layer extension fields
  reports:
    description: "Reporting layer - Analyst-generated text reports"
    fields:
      # Each analyst report field is usually automatically registered by the Agent
      # Some common report fields can be predefined here
      summary_report:
        type: string
        description: "Comprehensive analysis summary report"

  # Decision-making layer extension fields
  decisions:
    description: "Decision-making layer - decision-related data"
    fields:
      # Core decision fields (investment_debate, trade_signal etc.) are defined in the code
      # Extended decision fields can be added here
      position_suggestion:
        type: object
        description: "Position recommendations"
      
      stop_loss:
        type: object
        description: "Stop loss advice"
      
      take_profit:
        type: object
        description: "Take profit advice"


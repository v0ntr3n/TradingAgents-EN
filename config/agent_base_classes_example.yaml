# Agent Base class configuration example
# v2.0 New: Configuration examples of 5 Agent base classes

# ============================================
# mode A: analyst Agent (AnalystAgent)
# ============================================

# market analyst
market_analyst:
  base_class: AnalystAgent
  analyst_type: market
  output_field: market_report
  
  # Tool configuration
  tools:
    - get_stock_price
    - get_technical_indicators
    - get_volume_data
  
  # Prompt word configuration
  prompts:
    system: |
      You are a professional market analyst who is good at technical analysis.
      You ll need to analyze a stock s price action, technical indicators, and volume.
      
    user_template: |
      Please analyze {ticker} in {analysis_date} market performance:
      
      Price data:
      {price_data}
      
      Technical indicators:
      {technical_indicators}
      
      Volume:
      {volume_data}
      
      Please give a detailed technical analysis report.

# news analyst
news_analyst:
  base_class: AnalystAgent
  analyst_type: news
  output_field: news_report
  
  tools:
    - get_news
    - get_sentiment_analysis
  
  prompts:
    system: |
      You are a professional news analyst who specializes in sentiment analysis.
      You need to analyze the impact of news on stocks.
      
    user_template: |
      Please analyze {ticker} in {analysis_date} news:
      
      News list:
      {news_data}
      
      Sentiment analysis:
      {sentiment_data}
      
      Please provide a detailed news analysis report.

# fundamental analyst
fundamentals_analyst:
  base_class: AnalystAgent
  analyst_type: fundamentals
  output_field: fundamentals_report
  
  tools:
    - get_financial_statements
    - get_financial_ratios
    - get_earnings_data
  
  prompts:
    system: |
      You are a professional fundamental analyst who is good at financial analysis.
      You need to analyze the company s financial health and valuation.
      
    user_template: |
      Please analyze {ticker} Fundamentals of:
      
      Financial statements:
      {financial_statements}
      
      Financial Ratios:
      {financial_ratios}
      
      Profit data:
      {earnings_data}
      
      Please provide a detailed fundamental analysis report.

# ============================================
# mode B: researcher Agent (ResearcherAgent)
# ============================================

# bullish researcher
bull_researcher:
  base_class: ResearcherAgent
  researcher_type: bull
  output_field: bull_report
  stance: bull
  
  # Reports required
  required_reports:
    - market_report
    - news_report
    - fundamentals_report
  
  # Prompt word configuration
  prompts:
    system: |
      You are a bullish researcher and need a comprehensive analysis from a bullish perspective.
      You need to find all the reasons to buy.
      
    user_template: |
      Please analyze from a bullish perspective {ticker}: 
      
      Market analysis:
      {market_report}
      
      News analysis:
      {news_report}
      
      Fundamental analysis:
      {fundamentals_report}
      
      Please give your bullish view and reasons.

# bearish researcher
bear_researcher:
  base_class: ResearcherAgent
  researcher_type: bear
  output_field: bear_report
  stance: bear
  
  required_reports:
    - market_report
    - news_report
    - fundamentals_report
  
  prompts:
    system: |
      You are a bearish researcher and need a comprehensive analysis from a bearish perspective.
      You need to find all the reasons to sell.
      
    user_template: |
      Please analyze it from a bearish perspective {ticker}: 
      
      Market analysis:
      {market_report}
      
      News analysis:
      {news_report}
      
      Fundamental analysis:
      {fundamentals_report}
      
      Please give your bearish view and reasons.

# ============================================
# mode C: manager Agent (ManagerAgent)
# ============================================

# research manager
research_manager:
  base_class: ManagerAgent
  manager_type: research
  output_field: investment_plan
  enable_debate: true
  debate_rounds: 2
  
  # required input
  required_inputs:
    - bull_report
    - bear_report
  
  # Prompt word configuration
  prompts:
    system: |
      You are a research manager who needs to combine bullish and bearish views to make decisions.
      You need to weigh the reasons from both sides and make a final investment recommendation.
      
    user_template: |
      Please analyze comprehensively {ticker} investment opportunities:
      
      Bullish view:
      {bull_report}
      
      Bearish view:
      {bear_report}
      
      Debate summary:
      {debate_summary}
      
      Please give your final investment plan (buy/hold/sell).

# risk manager
risk_manager:
  base_class: ManagerAgent
  manager_type: risk
  output_field: risk_assessment
  enable_debate: false

  required_inputs:
    - investment_plan
    - market_report
    - fundamentals_report

  prompts:
    system: |
      You are a risk manager who needs to assess investment risks.
      You need to identify potential risks and provide risk control recommendations.

    user_template: |
      Please evaluate {ticker} Investment risks:

      Investment plan:
      {investment_plan}

      Market analysis:
      {market_report}

      Fundamental analysis:
      {fundamentals_report}

      Please provide risk assessment and control suggestions.

# ============================================
# mode D: trader Agent (TraderAgent)
# ============================================

# trader
trader:
  base_class: TraderAgent
  output_field: trading_plan

  # Prompt word configuration
  prompts:
    system: |
      You are a professional trader who needs to generate specific trading instructions based on your investment plan.
      You need to consider the buying price, quantity, stop loss level, take profit level, etc.

    user_template: |
      please for {ticker} Generate a trading plan:

      Investment plan:
      {investment_plan}

      Risk assessment:
      {risk_assessment}

      Market analysis:
      {market_report}

      All reports:
      {all_reports}

      Historical transactions:
      {historical_trades}

      Please give specific trading instructions (buy price, quantity, stop loss, take profit).

# ============================================
# mode E: Post-processing Agent (PostProcessorAgent)
# ============================================

# report saver
report_saver:
  base_class: PostProcessorAgent
  processor_type: save_report

  operations:
    - type: save_to_mongodb
      collection: analysis_reports
      fields:
        - analysis_id
        - ticker
        - analysis_date
        - market_report
        - news_report
        - fundamentals_report
        - bull_report
        - bear_report
        - investment_plan
        - risk_assessment
        - trading_plan

    - type: save_to_file
      path: "data/reports/{ticker}_{date}.json"
      format: json

  conditions:
    - field: success
      operator: equals
      value: true

# Email Notifier
email_notifier:
  base_class: PostProcessorAgent
  processor_type: send_email

  operations:
    - type: send_email
      to: "{user.email}"
      subject: "{ticker} Analysis completed - {recommendation}"
      template: analysis_complete
      use_llm_summary: true
      attachments:
        - type: json
          path: "data/reports/{ticker}_{date}.json"

  conditions:
    - field: investment_plan.recommendation
      operator: in
      value: ["buy", "sell"]
    - field: investment_plan.confidence_score
      operator: greater_than
      value: 0.7

# System Notifier
system_notifier:
  base_class: PostProcessorAgent
  processor_type: send_notification

  operations:
    - type: send_notification
      notification_type: analysis
      title: "{ticker} Analysis completed"
      content: "{summary}"
      link: "/analysis/{analysis_id}"
      severity: info

  conditions:
    - field: success
      operator: equals
      value: true


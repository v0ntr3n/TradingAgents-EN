# TradingAgents-CN Log configuration file
# Support log configuration for different environments

[logging]
# Global log level:DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"

# Log format configuration
[logging.format]
console = "%(asctime)s | %(name)-20s | %(levelname)-8s | %(message)s"
file = "%(asctime)s | %(name)-20s | %(levelname)-8s | %(module)s:%(funcName)s:%(lineno)d | %(message)s"
structured = "json"
file_json = true  # Enable file log JSON output (webapi.log and worker.log)


# Processor configuration
[logging.handlers]

# console processor
[logging.handlers.console]
enabled = true
colored = true  # Whether to enable color output
level = "INFO"

# file processor
[logging.handlers.file]
enabled = true
level = "DEBUG"
max_size = "10MB"
backup_count = 5
directory = "./logs"

# Error log processor (only records WARNING and above levels)
[logging.handlers.error]
enabled = true
level = "WARNING"  # record only WARNING, ERROR, CRITICAL
max_size = "10MB"
backup_count = 5
directory = "./logs"
filename = "error.log"

# Skill Workshop log processor (separately records the skill generation process to facilitate troubleshooting)
[logging.handlers.skill]
enabled = true
level = "DEBUG"  # skill The generation process requires detailed logs
max_size = "20MB"
backup_count = 10
directory = "./logs"
filename = "skill_workshop.log"

# Structured log processor (JSON format)
[logging.handlers.structured]
enabled = false  # Off by default, can be enabled in production environment
level = "INFO"
directory = "./logs"

# Specific logger configuration
[logging.loggers]

# Main application log
[logging.loggers.tradingagents]
level = "INFO"

# Web Interface log
[logging.loggers.web]
level = "INFO"

# Data flow log
[logging.loggers.dataflows]
level = "INFO"

# LLM Adapter log
[logging.loggers.llm_adapters]
level = "INFO"

# Skill Workshop log (output separately to skill_workshop.log)
[logging.loggers.skill_workshop]
level = "DEBUG"

# Third-party library logs (usually set to WARNING to reduce noise)
[logging.loggers.streamlit]
level = "WARNING"

[logging.loggers.urllib3]
level = "WARNING"

[logging.loggers.requests]
level = "WARNING"

[logging.loggers.matplotlib]
level = "WARNING"

[logging.loggers.fontTools]
level = "WARNING"

[logging.loggers."fontTools.subset"]
level = "WARNING"

[logging.loggers.pandas]
level = "WARNING"

# Docker Environment configuration
[logging.docker]
enabled = false  # Automatically detect Docker environments
stdout_only = true  # Docker The environment only outputs to stdout
disable_file_logging = true  # Docker Environment disabling file logging

# Development environment configuration
[logging.development]
enabled = false  # development mode
debug_modules = ["tradingagents.graph", "tradingagents.llm_adapters"]  # Module for detailed logging during development
save_debug_files = true  # Save debug file

# Production environment configuration
[logging.production]
enabled = false  # production mode
structured_only = true  # Only use structured logging
error_notification = true  # Error notification
max_log_size = "100MB"  # Larger log files for production environments

# Performance monitoring log
[logging.performance]
enabled = true
log_slow_operations = true
slow_threshold_seconds = 5.0  # Operations longer than 5 seconds are recorded as slow operations
log_memory_usage = false  # Whether to log memory usage

# security log
[logging.security]
enabled = true
log_api_calls = true  # Logging API calls
log_token_usage = true  # Record Token usage
mask_sensitive_data = true  # Block sensitive data

# Business log
[logging.business]
enabled = true
log_analysis_events = true  # Log analysis events
log_user_actions = true  # Record user actions
log_export_events = true  # Log export events

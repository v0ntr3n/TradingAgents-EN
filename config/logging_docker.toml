# Docker Environment-specific log configuration - full fix
# solve KeyError: 'file'Error

[logging]
level = "INFO"

[logging.format]
# All format configurations must be included
console = "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
file = "%(asctime)s | %(name)-20s | %(levelname)-8s | %(module)s:%(funcName)s:%(lineno)d | %(message)s"
structured = "json"

[logging.handlers]

# console output
[logging.handlers.console]
enabled = true
colored = false
level = "INFO"

# File output - full configuration
[logging.handlers.file]
enabled = true
level = "DEBUG"
max_size = "100MB"
backup_count = 5
directory = "/app/logs"

# Main log file (tradingagents.log)
[logging.handlers.main]
enabled = true
level = "INFO"
max_size = "100MB"
backup_count = 5
filename = "/app/logs/tradingagents.log"

# WebAPI log file
[logging.handlers.webapi]
enabled = true
level = "DEBUG"
max_size = "100MB"
backup_count = 5
filename = "/app/logs/webapi.log"

# Worker log file
[logging.handlers.worker]
enabled = true
level = "DEBUG"
max_size = "100MB"
backup_count = 5
filename = "/app/logs/worker.log"

# error log file
[logging.handlers.error]
enabled = true
level = "WARNING"
max_size = "100MB"
backup_count = 5
filename = "/app/logs/error.log"

# Structured log
[logging.handlers.structured]
enabled = true
level = "INFO"
directory = "/app/logs"

[logging.loggers]
[logging.loggers.tradingagents]
level = "INFO"

[logging.loggers.web]
level = "INFO"

[logging.loggers.components]
level = "WARNING"

[logging.loggers.dataflows]
level = "INFO"

[logging.loggers.llm_adapters]
level = "INFO"

[logging.loggers.streamlit]
level = "WARNING"

[logging.loggers.urllib3]
level = "WARNING"

[logging.loggers.requests]
level = "WARNING"

[logging.loggers.matplotlib]
level = "WARNING"

[logging.loggers.fontTools]
level = "WARNING"

[logging.loggers."fontTools.subset"]
level = "WARNING"

[logging.loggers.pandas]
level = "WARNING"

# Docker Configuration - Fixed version
[logging.docker]
enabled = true
stdout_only = false  # Simultaneously output to file and stdout
disable_file_logging = false  # Enable file logging

[logging.development]
enabled = false
debug_modules = ["tradingagents.graph", "tradingagents.llm_adapters"]
save_debug_files = true

[logging.production]
enabled = false
structured_only = false
error_notification = true
max_log_size = "100MB"

[logging.performance]
enabled = true
log_slow_operations = true
slow_threshold_seconds = 10.0
log_memory_usage = false

[logging.security]
enabled = true
log_api_calls = true
log_token_usage = true
mask_sensitive_data = true

[logging.business]
enabled = true
log_analysis_events = true
log_user_actions = true
log_export_events = true

# Post-processing Agent configuration example
# Shows how to configure various post-processing operations

# 1. Report Save Agent Configuration
report_saver:
  enabled: true
  agent_id: report_saver
  
  # Operation list
  operations:
    # save to MongoDB
    - type: save_to_mongodb
      collection: analysis_reports
      fields:
        - analysis_id
        - ticker
        - analysis_date
        - market_report
        - news_report
        - fundamentals_report
        - bull_report
        - bear_report
        - investment_plan
        - trading_plan
    
    # Save to file system
    - type: save_to_file
      path: "data/reports/{ticker}_{date}.json"
      format: json
    
    # Save to S3 (future support)
    # - type: save_to_s3
    #   bucket: trading-reports
    #   key: "reports/{ticker}/{date}.json"
  
  # Execution conditions
  conditions:
    - field: success
      operator: equals
      value: true

# 2. Email notification Agent configuration
email_notifier:
  enabled: true
  agent_id: email_notifier
  
  operations:
    - type: send_email
      # Recipient (supports template variables)
      to: "{user.email}"
      
      # Email subject
      subject: "{ticker} Analysis completed - {recommendation}"
      
      # Email template
      template: analysis_complete
      
      # Whether to use LLM to generate summaries
      use_llm_summary: true
      llm_prompt: "Please summarize the core points of this analysis report in 3 sentences."
      
      # Accessory configuration
      attachments:
        - type: pdf
          source: pdf_report
          filename: "analysis_report.pdf"
  
  # Execution conditions (only sent when important signals occur)
  conditions:
    - field: user.email_settings.enabled
      operator: equals
      value: true
    - field: investment_plan.recommendation
      operator: in
      value: ["buy", "sell"]
    - field: investment_plan.confidence_score
      operator: greater_than
      value: 0.7

# 3. System notification Agent configuration
system_notifier:
  enabled: true
  agent_id: system_notifier
  
  operations:
    - type: send_notification
      notification_type: analysis
      title: "{ticker} Analysis completed"
      content: "{summary}"
      link: "/analysis/{analysis_id}"
      severity: info
  
  conditions:
    - field: success
      operator: equals
      value: true

# 4. Webhook Trigger Agent configuration (future implementation)
webhook_trigger:
  enabled: false
  agent_id: webhook_trigger
  
  operations:
    - type: trigger_webhook
      url: "https://api.example.com/trading-signal"
      method: POST
      headers:
        Authorization: "Bearer {api_key}"
        Content-Type: "application/json"
      body:
        ticker: "{ticker}"
        recommendation: "{recommendation}"
        confidence: "{confidence_score}"
        timestamp: "{timestamp}"
      
      # Retry configuration
      retry:
        max_attempts: 3
        backoff: exponential
  
  conditions:
    - field: investment_plan.recommendation
      operator: in
      value: ["buy", "sell"]
    - field: investment_plan.confidence_score
      operator: greater_than
      value: 0.8

# 5. PDF Generate Agent configuration (future implementation)
pdf_generator:
  enabled: false
  agent_id: pdf_generator
  
  operations:
    - type: generate_pdf
      template: standard_report
      output_path: "data/reports/{ticker}_{date}.pdf"
      include_charts: true
  
  conditions:
    - field: success
      operator: equals
      value: true

# 6. Chart generation Agent configuration (future implementation)
chart_generator:
  enabled: false
  agent_id: chart_generator
  
  operations:
    - type: generate_chart
      chart_type: price_trend
      output_path: "data/charts/{ticker}_{date}_price.png"
    
    - type: generate_chart

# Complete workflow configuration example (including post-processing)
# Show how to integrate post-processing into your workflow Agent

workflow:
  id: full_analysis_with_post_processing
  name: Complete analysis workflow (including post-processing)
  description: Complete closed loop from data acquisition to result processing
  version: "2.0"
  
  # Workflow node
  nodes:
    # ========== analysis stage ==========
    
    # 1. market analyst
    - id: market_analyst
      type: agent
      agent_id: market_analyst_v2
      config:
        tools:
          - get_stock_price
          - get_technical_indicators
    
    # 2. news analyst
    - id: news_analyst
      type: agent
      agent_id: news_analyst_v2
      config:
        tools:
          - get_news
          - get_sentiment
    
    # 3. fundamental analyst
    - id: fundamentals_analyst
      type: agent
      agent_id: fundamentals_analyst_v2
      config:
        tools:
          - get_financial_statements
          - get_company_info
    
    # 4. bullish researcher
    - id: bull_researcher
      type: agent
      agent_id: bull_researcher_v2
    
    # 5. bearish researcher
    - id: bear_researcher
      type: agent
      agent_id: bear_researcher_v2
    
    # 6. research manager
    - id: research_manager
      type: agent
      agent_id: research_manager_v2
    
    # 7. trader
    - id: trader
      type: agent
      agent_id: trader_v2
    
    # ========== Post-processing stage ==========
    
    # 8. Report saving (parallel execution)
    - id: save_report
      type: post_processor
      agent_id: report_saver
      config:
        operations:
          - type: save_to_mongodb
            collection: analysis_reports
            fields:
              - analysis_id
              - ticker
              - analysis_date
              - market_report
              - news_report
              - fundamentals_report
              - investment_plan
              - trading_plan
          
          - type: save_to_file
            path: "data/reports/{ticker}_{date}.json"
            format: json
        
        conditions:
          - field: success
            operator: equals
            value: true
    
    # 9. Email notification (parallel execution)
    - id: send_email
      type: post_processor
      agent_id: email_notifier
      config:
        operations:
          - type: send_email
            to: "{user.email}"
            subject: "{ticker} Analysis completed - {recommendation}"
            template: analysis_complete
            use_llm_summary: true
        
        conditions:
          - field: user.email_settings.enabled
            operator: equals
            value: true
          - field: investment_plan.recommendation
            operator: in
            value: ["buy", "sell"]
    
    # 10. System notification (parallel execution)
    - id: send_notification
      type: post_processor
      agent_id: system_notifier
      config:
        operations:
          - type: send_notification
            notification_type: analysis
            title: "{ticker} Analysis completed"
            content: "{summary}"
            link: "/analysis/{analysis_id}"
            severity: info
        
        conditions:
          - field: success
            operator: equals
            value: true
  
  # Workflow edges (define the order of execution)
  edges:
    # Serial execution of analysis phases
    - source: market_analyst
      target: bull_researcher
    
    - source: news_analyst
      target: bull_researcher
    
    - source: fundamentals_analyst
      target: bull_researcher
    
    - source: market_analyst
      target: bear_researcher
    
    - source: news_analyst
      target: bear_researcher
    
    - source: fundamentals_analyst
      target: bear_researcher
    
    - source: bull_researcher
      target: research_manager
    
    - source: bear_researcher
      target: research_manager
    
    - source: research_manager
      target: trader
    
    # Parallel execution of post-processing stages
    - source: trader
      target: save_report
    
    - source: trader
      target: send_email
    
    - source: trader
      target: send_notification
  
  # Workflow configuration
  config:
    # Parallel execution of post-processing nodes
    parallel_post_processing: true
    
    # Post-processing failure does not affect the main process
    post_processing_optional: true
    
    # Timeout configuration
    timeout: 300  # 5 minutes


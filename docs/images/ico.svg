<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The blue background covers the entire canvas to avoid white edges. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#409eff" />

  <!-- White rising polyline (slightly to the left, leaving room for dots) -->
  <path
    d="M220 640 L410 460 L580 640 L720 410"
    fill="none"
    stroke="#ffffff"
    stroke-width="96"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- The white dot in the upper right corner does not overlap with the polyline -->
  <circle cx="780" cy="300" r="60" fill="#ffffff" />
</svg>